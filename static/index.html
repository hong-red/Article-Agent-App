<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#20a53a">
  <title>妙文</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 登录 / 注册 -->
  <div id="view-login" class="login-wrap">
    <div class="login-card">
      <div class="login-logo">🧚 妙文</div>
      <p class="login-sub">公众号文章生成器 · 邀请制</p>
      <div class="tabs">
        <button class="tab active" id="tab-login">登录</button>
        <button class="tab" id="tab-register">注册</button>
      </div>
      <div class="form-row">
        <input id="lg-username" placeholder="用户名" autocomplete="username">
      </div>
      <div class="form-row">
        <input id="lg-password" type="password" placeholder="密码（至少 6 位）" autocomplete="current-password">
      </div>
      <div class="form-row hidden" id="lg-invite-row">
        <input id="lg-invite" placeholder="邀请码">
      </div>
      <button id="btn-auth" class="btn primary block">登录</button>
      <p class="hint center">免费期至 <b id="free-until">2026-12</b> · 到期后可自行迁移数据</p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="view-app" class="hidden">
    <header class="topbar">
      <div class="brand">🧚 妙文</div>
      <div class="topbar-actions">
        <button id="btn-library" class="btn ghost">本地库</button>
        <button id="btn-settings" class="btn ghost">设置</button>
        <button id="btn-logout" class="btn ghost">退出</button>
      </div>
    </header>

    <div class="stepper" id="stepper">
      <div class="step active" data-step="1"><span class="dot">1</span>选题</div>
      <div class="conn"></div>
      <div class="step" data-step="2"><span class="dot">2</span>成文</div>
      <div class="conn"></div>
      <div class="step" data-step="3"><span class="dot">3</span>选图</div>
      <div class="conn"></div>
      <div class="step" data-step="4"><span class="dot">4</span>排版</div>
    </div>

    <main class="container">
      <!-- 第一步 -->
      <section id="step-1" class="panel">
        <h2>第一步 · 定主题，选题目</h2>
        <div class="form-row"><label>文章主题 / 关键词 <em>*</em></label>
          <textarea id="s1-topic" rows="3" placeholder="例如：如何高效学习 Python"></textarea></div>
        <div class="form-grid">
          <div class="form-row"><label>写作模板</label><select id="s1-template"></select></div>
          <div class="form-row"><label>风格倾向（可选）</label><input id="s1-style" placeholder="轻松幽默 / 专业严谨"></div>
          <div class="form-row"><label>补充说明（可选）</label><input id="s1-extra" placeholder="面向零基础读者"></div>
          <div class="form-row"><label>生成数量</label>
            <select id="s1-count"><option>3</option><option selected>5</option><option>8</option></select></div>
        </div>
        <div class="actions"><button id="btn-gen-titles" class="btn primary">生成题目</button></div>
        <div id="titles-box" class="titles-box"></div>
        <div class="actions step-nav"><button id="btn-to-step2" class="btn primary" disabled>下一步：生成正文</button></div>
      </section>

      <!-- 第二步 -->
      <section id="step-2" class="panel hidden">
        <h2>第二步 · 生成正文</h2>
        <div class="summary-line" id="s2-topic"></div>
        <div class="form-row"><label>文章标题</label><input id="s2-title" placeholder="标题"></div>
        <div class="actions"><button id="btn-gen-content" class="btn primary">生成正文</button></div>
        <div class="form-row"><label>正文（Markdown，可编辑）</label><textarea id="s2-md" rows="16"></textarea></div>
        <div class="form-row"><label>预览</label><div id="s2-preview" class="preview"><p class="muted">正文预览区</p></div></div>
        <div class="debug-box">
          <input id="s2-feedback" placeholder="调试意见，例如：开头更吸引人">
          <button id="btn-refine" class="btn">按意见重新生成</button>
        </div>
        <div class="actions step-nav">
          <button class="btn ghost" data-goto="1">上一步</button>
          <button id="btn-to-step3" class="btn primary">下一步：选图配图</button>
        </div>
      </section>

      <!-- 第三步 -->
      <section id="step-3" class="panel hidden">
        <h2>第三步 · 选图配图</h2>
        <div class="tabs">
          <button class="tab active" data-imgtab="local">本地上传</button>
          <button class="tab" data-imgtab="web">全网搜索</button>
        </div>
        <div id="img-tab-local">
          <div class="upload-row"><input type="file" id="img-file" multiple accept="image/*"><button id="btn-upload-img" class="btn primary">上传</button></div>
          <div id="img-local-grid" class="img-grid"></div>
        </div>
        <div id="img-tab-web" class="hidden">
          <div class="search-row"><input id="img-query" placeholder="关键词，如：城市夜景"><button id="btn-search-img" class="btn primary">搜索</button></div>
          <div id="img-web-grid" class="img-grid"></div>
        </div>
        <div class="selected-head">已选图片（<span id="img-count">0</span> 张）</div>
        <div id="img-selected" class="img-grid selected"></div>
        <div class="actions step-nav">
          <button class="btn ghost" data-goto="2">上一步</button>
          <button id="btn-to-step4" class="btn primary">下一步：格式优化</button>
        </div>
      </section>

      <!-- 第四步 -->
      <section id="step-4" class="panel hidden">
        <h2>第四步 · 格式优化与美化</h2>
        <div class="form-grid">
          <div class="form-row"><label>配色方案</label><select id="s3-theme"></select></div>
          <div class="form-row"><label>语气</label>
            <select id="s3-tone"><option value="">保持不变</option><option>正式专业</option><option>轻松活泼</option><option>温暖治愈</option><option>犀利观点</option></select></div>
        </div>
        <div class="form-row toggles">
          <label><input type="checkbox" id="s3-polish" checked> 智能排版润色</label>
          <label><input type="checkbox" id="s3-summary"> 加导语摘要</label>
          <label><input type="checkbox" id="s3-golden"> 提炼金句</label>
          <label><input type="checkbox" id="s3-follow"> 结尾引导关注</label>
        </div>
        <div class="actions"><button id="btn-format" class="btn primary">格式优化</button></div>
        <div class="form-row"><label>正文（Markdown）</label><textarea id="s3-md" rows="16"></textarea></div>
        <div class="form-row"><label>预览</label><div id="s3-preview" class="preview"></div></div>
        <div class="form-row"><label>封面图（可选）</label><input type="file" id="s3-cover" accept="image/*"><div id="s3-cover-preview" class="cover-preview"></div></div>
        <div class="actions step-nav">
          <button class="btn ghost" data-goto="3">上一步</button>
          <div class="step-nav-right">
            <button id="btn-save" class="btn ghost">保存</button>
            <button id="btn-push" class="btn primary">推送到草稿箱</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div id="modal-settings" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head"><h3>设置</h3><button class="icon-btn" data-close="modal-settings">×</button></div>
      <div class="modal-body">
        <fieldset>
          <legend>DeepSeek（内容生成）</legend>
          <div class="form-row"><label>API Key</label><input id="cfg-key" type="password" placeholder="sk-..."></div>
          <div class="form-row"><label>模型</label>
            <select id="cfg-model"><option value="deepseek-chat">deepseek-chat（快）</option><option value="deepseek-reasoner">deepseek-reasoner（推理强）</option></select></div>
        </fieldset>
        <fieldset>
          <legend>微信公众号（可选）</legend>
          <div class="form-row"><label>AppID</label><input id="cfg-appid" placeholder="wx..."></div>
          <div class="form-row"><label>AppSecret</label><input id="cfg-secret" type="password" placeholder="..."></div>
          <div class="form-row"><label>作者名（可选）</label><input id="cfg-author"></div>
          <div class="form-row"><label>原文链接（可选）</label><input id="cfg-source-url"></div>
        </fieldset>
        <div class="actions">
          <button id="btn-export" class="btn ghost">导出我的数据</button>
          <button id="btn-save-config" class="btn primary">保存设置</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 本地库弹窗 -->
  <div id="modal-library" class="modal-mask hidden">
    <div class="modal wide">
      <div class="modal-head"><h3>本地库</h3><button class="icon-btn" data-close="modal-library">×</button></div>
      <div class="modal-body"><div id="library-list" class="library-list"></div></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
